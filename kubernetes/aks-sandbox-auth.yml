apiVersion: apps/v1
kind: Deployment
metadata:
  name: authservice
  namespace: ecommerce-sandbox
  labels:
    app: authservice
    environment: sandbox
spec:
  replicas: 1
  selector:
    matchLabels:
      app: authservice
  template:
    metadata:
      labels:
        app: authservice
        environment: sandbox
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8080"
    spec:
      imagePullSecrets:
        - name: acr-pull-secret
      volumes:
        - name: jwt-signing-key
          secret:
            secretName: auth-signing-secret
            items:
              - key: private-key-pem
                path: private.pem
      containers:
        - name: authservice
          image: $(ACR_NAME).azurecr.io/authservice:$(IMAGE_TAG)
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 6
          volumeMounts:
            - name: jwt-signing-key
              mountPath: /app/keys
              readOnly: true
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: ConnectionStrings__Default
              valueFrom:
                secretKeyRef:
                  name: db-auth-secret
                  key: connection-string
            - name: Authentication__AuthMicroserviceBaseAddress
              value: http://auth-clusterip-service:8080
            - name: Authentication__Signing__PrivateKeyPath
              value: /app/keys/private.pem
            - name: Authentication__Signing__KeyId
              valueFrom:
                secretKeyRef:
                  name: auth-signing-secret
                  key: key-id
            - name: APPLICATIONINSIGHTS_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: appinsights-secret
                  key: connection-string
            - name: OpenTelemetry__Exporter
              value: AzureMonitor
            - name: OpenTelemetry__SamplingRatio
              value: "0.1"
            - name: OpenTelemetry__ServiceVersion
              value: "1.0.0"
            - name: OpenTelemetry__Environment
              value: Sandbox
---
apiVersion: v1
kind: Service
metadata:
  name: auth-clusterip-service
  namespace: ecommerce-sandbox
spec:
  type: ClusterIP
  selector:
    app: authservice
  ports:
    - port: 8080
      targetPort: 8080
