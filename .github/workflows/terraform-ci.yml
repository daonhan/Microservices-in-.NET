name: Terraform CI

# Credential-free static gate for the Terraform sbx2 lane, mirroring the
# kubeconform manifest gate in docker-build.yml. Runs fmt / validate / tflint
# on any PR (or push to main) that touches terraform/. No Azure credentials:
# `validate -backend=false` needs none, so the gate never reaches Azure.

on:
  push:
    branches: [main]
    paths: ['terraform/**']
  pull_request:
    branches: [main]
    paths: ['terraform/**']

permissions:
  contents: read

defaults:
  run:
    working-directory: terraform

jobs:
  static-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: Terraform fmt
        run: terraform fmt -check -recursive -diff

      - name: Terraform init (no backend)
        run: terraform init -backend=false -input=false

      - name: Terraform validate
        run: terraform validate -no-color

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.53.0

      - name: TFLint
        run: |
          tflint --init
          tflint --no-color
