# Documentation gate pipeline. Independent of per-service pipelines.
#
# Step 1: Verify documentation drift (scripts/check-doc-drift.sh).
# Step 2: Verify markdown links via lychee in offline mode (relative paths +
#         anchors validated; external http(s) links skipped).
#
# Either step exiting non-zero fails the build.

trigger:
  branches:
    include:
      - main
      - dev
      - staging
      - prod
  paths:
    include:
      - '**/*.md'
      - docs/**
      - docker-compose.yaml
      - scripts/check-doc-drift.ps1
      - scripts/check-doc-drift.sh
      - azure-pipelines.docs.yml

pr:
  branches:
    include:
      - '*'
  paths:
    include:
      - '**/*.md'
      - docs/**
      - docker-compose.yaml
      - scripts/check-doc-drift.ps1
      - scripts/check-doc-drift.sh
      - azure-pipelines.docs.yml

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self
    displayName: Checkout source

  - bash: |
      set -euo pipefail
      chmod +x scripts/check-doc-drift.sh
      scripts/check-doc-drift.sh
    displayName: Verify documentation drift
    workingDirectory: $(Build.SourcesDirectory)

  - bash: |
      set -euo pipefail
      # Enumerate explicitly via find so the link-check step does not depend on
      # lychee's internal glob expansion or the host shell's globstar setting.
      # Paths are workspace-relative because lychee runs with -w /workspace.
      # Do not pass --base-url/--base: markdown relative links must resolve from
      # each source file's directory. Wiki pages use extensionless page links, so
      # fallback to .md for local validation.
      mapfile -d '' DOC_FILES < <(find docs -type f -name '*.md' -print0)
      docker run --rm \
        -v "$(Build.SourcesDirectory):/workspace" \
        -w /workspace \
        lycheeverse/lychee:0.24.2 \
        --offline \
        --no-progress \
        --root-dir /workspace \
        --fallback-extensions md \
        README.md \
        CONTEXT.md \
        AGENTS.md \
        "${DOC_FILES[@]}"
    displayName: Verify markdown links
    workingDirectory: $(Build.SourcesDirectory)
